    <details class="demo-source"><summary>Inspect the layout CSS</summary><pre tabindex="0" aria-label="CSS for the project layout"><code data-layout-source>/* Columns follow the browser's width: 1, 2 or 4. */
.demo-stage { container-type: inline-size; }
.preview-projects {
  display: grid;
  gap: 12px;
}
@container (width >= 480px) {
  .preview-projects[data-layout=cards] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@container (width >= 1000px) {
  .preview-projects[data-layout=cards] {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}</code></pre><p>This is the CSS behind the layout above. Switch between Cards and List to see it change.</p></details>
