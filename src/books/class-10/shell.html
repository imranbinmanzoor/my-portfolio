<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="book-release" content="r12" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Class 10 Mathematics : PECTAA solutions</title>
    <meta
      name="description"
      content="Independent Class 10 mathematics solutions by Muhammad Imran. Study Complex Numbers with explained steps, compact working and practice papers."
    />
    <meta name="theme-color" content="#2855D9" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500;1,14..32,600;1,14..32,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/contrib/auto-render.min.js"
    ></script>
    <style>@@SOURCE(src/books/class-10/style-1.css)@@</style>
  <link rel="canonical" href="https://imranbinmanzoor.com/solutions/class-10/">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/book-pilot.css">
<meta property="og:type" content="website"><meta property="og:title" content="Class 10 Mathematics — Muhammad Imran"><meta property="og:description" content="Independent mathematics solutions: Complex Numbers, worked exercises and practice tools."><meta property="og:url" content="https://imranbinmanzoor.com/solutions/class-10/">
</head>
  <body data-book-pilot data-book-frame>
@@SOURCE(src/components/book-return.html)@@
    <a class="skip" href="#main">Skip to content</a>

    <!-- ===================== BOOK VIEW ===================== -->
    <section class="view" id="view-book">
      <main class="wrap" id="book-main" tabindex="-1"></main>
    </section>

    <!-- ===================== UNIT VIEW ===================== -->
    <section class="view" id="view-unit" hidden>
      <header class="masthead">
        <div class="wrap">
          <nav class="crumb" aria-label="Breadcrumb">
            <ol>
              <li><a href="#/">Class 10 Mathematics</a></li>
              <li aria-current="page" id="crumb-unit"></li>
            </ol>
          </nav>
          <h1 class="unit-title" id="unit-title"></h1>
          <div class="search">
            <svg
              class="search-i"
              viewBox="0 0 20 20"
              aria-hidden="true"
              focusable="false"
            >
              <circle
                cx="9"
                cy="9"
                r="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M13.5 13.5 L18 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <input
              id="q"
              type="search"
              aria-label="Search this unit"
              placeholder="Search this unit"
              aria-describedby="q-help"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="q-clear" type="button" aria-label="Clear search" hidden>
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
          <p id="q-help" class="search-help"></p>
          <p
            id="q-count"
            class="search-count"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </header>

      <div class="results" id="results" hidden></div>

      <div class="tabs-wrap" id="tabsWrap">
        <div class="wrap">
          <div class="tabs-shell" id="tabsShell">
            <div
              role="tablist"
              aria-label="Sections of this unit"
              id="tablist"
            ></div>
          </div>
        </div>
      </div>

      <main id="main" class="wrap" tabindex="-1"><div id="panels"></div></main>
    </section>

    <noscript
      ><p class="wrap">
        This interactive book needs JavaScript to show its worked solutions.
        Enable JavaScript, then reload this page.
      </p></noscript
    >
    <p class="math-status wrap" id="math-status" role="status" hidden>
      Math formatting could not load. Check your connection, then
      <button type="button" id="math-retry">retry math formatting</button>. The
      written explanations are still available.
    </p>
    <button id="toTop" aria-label="Back to top" title="Back to top">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path
          d="M12 19V5M12 5l-6 6M12 5l6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <script id="book-data" type="application/json">@@JSON(content/books/class-10/book-data.json)@@</script>
    <script id="content-data" type="application/json">@@JSON(content/books/class-10/content-data.json)@@</script>
    <script id="banks-data" type="application/json">@@JSON(content/books/class-10/banks-data.json)@@</script>
    <script>@@SOURCE(src/books/class-10/runtime-1.js)@@</script>
  </body>
</html>
