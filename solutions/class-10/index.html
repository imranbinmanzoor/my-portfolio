<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Class 10 Mathematics : PECTAA solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <style>
      /* ==========================================================================
   TOKENS
   Type is dark throughout. This is a study book; grey pushes prose out of
   focus. Only true chrome is lighter.
   Shape: rectangles with small rounded corners. No capsules anywhere.
   ========================================================================== */
      :root {
        --sand-50: #fffdf8;
        --sand-100: #fdf8ef;
        --sand-200: #f8f1e4;
        --sand-300: #eee3d1;
        --sand-400: #ddcdb3;
        --brown-600: #6b5b47;
        --brown-700: #4a3c2c;
        --brown-800: #332618;
        --brown-900: #241a10;
        --green-50: #e8f2ed;
        --green-100: #cfe4da;
        --green-600: #186b53;
        --green-700: #115442;
        --green-800: #0c3f31;
        --clay-50: #fbeade;
        --clay-100: #f2d4bd;
        --clay-600: #a8501c;
        --clay-700: #7d3910;

        --font-ui:
          "Inter", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;

        /* Type scale. Sized by importance, not by decoration. */
        --size-100: 0.8125rem; /* chrome: step numbers, meta      */
        --size-200: 0.9375rem; /* level-2 nav, small labels       */
        --size-300: 1rem; /* level-1 nav, notes              */
        --size-400: 1.125rem; /* body prose                      */
        --size-500: 1.375rem; /* h3                              */
        --size-600: 1.6875rem; /* h2                              */
        --size-700: 2rem; /* unit title                      */

        --leading-tight: 1.25;
        --leading-body: 1.6;
        --measure: 68ch;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;

        /* Rectangles with rounded corners. Nothing is a capsule. */
        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        /* Capsules and circles are used for tags, counts and icon buttons. Rounded
     rectangles are used for anything that behaves like a button or a panel.
     Mixing the two deliberately is what separates a tag from a control. */
        --radius-pill: 999px;

        /* Minimum touch targets, WCAG 2.5.8 asks for 24px, we use 40/44. */
        --control-sm: 36px;
        --control-md: 44px;

        --surface-page: var(--sand-200);
        --surface-raised: var(--sand-50);
        --surface-sunken: var(--sand-100);
        --text-strong: var(--brown-900);
        --text-body: var(--brown-800);
        --text-secondary: var(--brown-700);
        --text-chrome: var(--brown-600);
        --border: var(--sand-300);
        --border-strong: var(--sand-400);
        --primary: var(--green-700);
        --primary-tint: var(--green-50);
        --primary-line: var(--green-100);
        --accent: var(--clay-600);
        --accent-tint: var(--clay-50);
        --accent-line: var(--clay-100);

        /* One shadow, used only where a sticky bar overlaps content it must sit in
     front of. Borders do the rest of the work. */
        --shadow-sticky: 0 2px 6px rgba(36, 26, 16, 0.1);

        /* Measured at runtime so the three sticky levels stack exactly. */
        --sticky-tabs: 0px;
        --sticky-jump: 0px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--surface-page);
        color: var(--text-body);
        font-family: var(--font-ui);
        font-size: var(--size-400);
        line-height: var(--leading-body);
        font-synthesis-weight: none;
      }
      .wrap {
        max-width: calc(var(--measure) + var(--space-8));
        margin: 0 auto;
        padding: 0 var(--space-4);
      }

      .skip {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 100;
        background: var(--primary);
        color: #fff;
        padding: var(--space-3) var(--space-4);
        border-radius: 0 0 var(--radius-md) 0;
        font-weight: 600;
      }
      .skip:focus {
        left: 0;
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
        border-radius: var(--radius-xs);
      }

      /* ============================ LEVEL 1: chapter tabs ====================== */
      .tabs-wrap {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--surface-page);
        border-bottom: 1px solid var(--border);
      }
      .tabs-wrap.is-stuck {
        box-shadow: var(--shadow-sticky);
      }
      /* The masthead scrolls away. Only the tab strip stays pinned, so the sticky
   chrome costs about 60px instead of 146px. That matters most on a phone. */
      .masthead {
        padding: var(--space-4) 0 var(--space-3);
      }
      .crumb ol {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
        margin: 0 0 var(--space-2);
        padding: 0;
        font-size: var(--size-200);
      }
      .crumb li + li::before {
        content: "›";
        margin-right: var(--space-2);
        color: var(--text-chrome);
      }
      .crumb a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }
      .crumb a:hover {
        text-decoration: underline;
      }
      .crumb [aria-current] {
        color: var(--text-chrome);
      }
      .u-n {
        color: var(--primary);
      }
      .search {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: var(--space-4);
      }
      .search-i {
        position: absolute;
        left: var(--space-3);
        width: 20px;
        height: 20px;
        color: var(--text-chrome);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        min-height: var(--control-md);
        font: inherit;
        font-size: var(--size-300);
        color: var(--text-body);
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        padding: var(--space-2) var(--space-8) var(--space-2)
          calc(var(--space-4) + 22px);
      }
      .search input::placeholder {
        color: var(--text-chrome);
      }
      .search input::-webkit-search-cancel-button {
        display: none;
      }
      #q-clear {
        position: absolute;
        right: var(--space-2);
        width: 32px;
        height: 32px;
        border: 0;
        background: none;
        color: var(--text-chrome);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        border-radius: var(--radius-xs);
      }
      #q-clear:hover {
        background: var(--sand-300);
        color: var(--text-strong);
      }
      .search-help {
        margin: var(--space-2) 0 0;
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .search-count {
        margin: var(--space-2) 0 0;
        font-size: var(--size-200);
        color: var(--primary);
        font-weight: 500;
      }
      .search-count:empty {
        display: none;
      }
      mark {
        background: #fdf0a8;
        color: inherit;
        border-radius: 2px;
        padding: 0 2px;
      }
      .no-match {
        display: none !important;
      }
      .kicker {
        font-size: var(--size-100);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-chrome);
        font-weight: 600;
        margin: 0;
      }
      .unit-title {
        font-size: var(--size-700);
        line-height: var(--leading-tight);
        color: var(--text-strong);
        margin: var(--space-1) 0 0;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      /* The strip scrolls, but the scrollbar is hidden. A soft fade at each end
   shows there is more to reach, which reads better on a phone than a bar. */
      .tabs-shell {
        position: relative;
      }
      .tabs-shell::before,
      .tabs-shell::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40px;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .tabs-shell::before {
        left: 0;
        background: linear-gradient(
          to right,
          var(--surface-page) 15%,
          rgba(248, 241, 228, 0)
        );
      }
      .tabs-shell::after {
        right: 0;
        background: linear-gradient(
          to left,
          var(--surface-page) 15%,
          rgba(248, 241, 228, 0)
        );
      }
      .tabs-shell.more-left::before {
        opacity: 1;
      }
      .tabs-shell.more-right::after {
        opacity: 1;
      }
      [role="tablist"] {
        display: flex;
        gap: var(--space-1);
        overflow-x: auto;
        padding: var(--space-2) 0;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        scroll-behavior: smooth;
      }
      [role="tablist"]::-webkit-scrollbar {
        display: none;
      }
      [role="tab"] {
        flex: 0 0 auto;
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        font: inherit;
        font-size: var(--size-200);
        font-weight: 500;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        padding: 0 var(--space-4);
        border-radius: var(--radius-md);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      [role="tab"]:hover {
        background: var(--sand-300);
        color: var(--text-strong);
      }
      [role="tab"][aria-selected="true"] {
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(17, 84, 66, 0.28);
      }

      /* ============================ LEVEL 2: section jump ===================== */
      /* A different shape and weight from level 1, so the two levels never wear the
   same treatment and the hierarchy stays readable when both are stuck. */
      .local-jump {
        position: sticky;
        top: var(--sticky-tabs);
        z-index: 30;
        padding: var(--space-2) 0 var(--space-3);
        background: var(--surface-page);
        box-shadow:
          -50vw 0 0 var(--surface-page),
          50vw 0 0 var(--surface-page);
      }
      .local-jump.is-stuck {
        box-shadow:
          -50vw 0 0 var(--surface-page),
          50vw 0 0 var(--surface-page),
          0 1px 0 var(--border);
      }
      /* A segmented control. One container, the selected segment lifted out of it.
   Subordinate to the tab strip by size and by weight, not by a second colour. */
      .local-jump .seg {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--sand-300);
        border-radius: var(--radius-md);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .local-jump .seg::-webkit-scrollbar {
        display: none;
      }
      .local-jump a {
        flex: 0 0 auto;
        min-height: var(--control-sm);
        display: inline-flex;
        align-items: center;
        padding: 0 var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--size-200);
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        white-space: nowrap;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .local-jump a:hover {
        color: var(--text-strong);
      }
      .local-jump a[aria-current="true"] {
        background: var(--surface-raised);
        color: var(--primary);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(36, 26, 16, 0.12);
      }

      [role="tabpanel"] {
        padding-bottom: var(--space-8);
      }
      [role="tabpanel"][hidden] {
        display: none;
      }
      .flow-section {
        margin: 0 0 var(--space-7);
        min-width: 0;
        scroll-margin-top: calc(
          var(--sticky-tabs) + var(--sticky-jump) + var(--space-3)
        );
      }

      h2 {
        font-size: var(--size-600);
        line-height: var(--leading-tight);
        color: var(--text-strong);
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      /* Heading and lede are ONE block with one gap after it. Without this wrapper the
   gap collapses to the h2 margin whenever a section has no lede, so Exercise 1.1
   sat tighter than Concepts and Examples. The rule must hold everywhere: every
   exercise, the review, the unit test and generated papers. */
      .flow-head {
        margin: var(--space-6) 0 var(--space-5);
      }
      .flow-section:first-child .flow-head,
      [role="tabpanel"] > .flow-section:first-of-type .flow-head {
        margin-top: var(--space-5);
      }
      .flow-head .lede {
        margin: var(--space-2) 0 0;
      }
      h3 {
        font-size: var(--size-500);
        line-height: var(--leading-tight);
        color: var(--text-strong);
        margin: 0 0 var(--space-3);
        font-weight: 600;
      }
      /* A heading inside Concepts, below the h2 but above the cards. It is not a new
   section, so it never appears in the section nav. */
      .sub-head {
        margin: var(--space-6) 0 var(--space-2);
        padding-top: var(--space-4);
        border-top: 1px solid var(--border-strong);
      }
      .lede {
        color: var(--text-secondary);
        font-size: var(--size-300);
        margin: 0 0 var(--space-5);
      }
      .flow-head + * {
        margin-top: 0;
      }

      /* ============================ LEVEL 3: question heading ================= */
      /* The heading is not inside the card. It sits on the page and sticks, while
   each part below it is its own card. That avoids a box inside a box, and it
   is what makes the question label stay visible while you read part (vii). */
      .qblock {
        min-width: 0;
        margin: 0 0 var(--space-7);
      }
      /* Only the label pins. The statement sits underneath it in normal flow, so it
   can wrap freely and is never cut off on a narrow screen. */
      .grp {
        position: sticky;
        top: calc(var(--sticky-tabs) + var(--sticky-jump));
        z-index: 20;
        display: flex;
        padding: var(--space-2) 0;
        background: var(--surface-page);
        box-shadow:
          -50vw 0 0 var(--surface-page),
          50vw 0 0 var(--surface-page);
      }
      .grp.is-stuck {
        box-shadow:
          -50vw 0 0 var(--surface-page),
          50vw 0 0 var(--surface-page),
          0 1px 0 var(--border);
      }
      /* A capsule for the label: it is a small standalone tag, and a pill reads as a
   tag where a rounded rectangle reads as a button. */
      .qn {
        display: inline-flex;
        align-items: center;
        background: var(--primary);
        color: #fff;
        font-size: var(--size-200);
        font-weight: 600;
        letter-spacing: 0.01em;
        padding: var(--space-1) var(--space-4);
        border-radius: var(--radius-pill);
        white-space: nowrap;
      }
      .qn.is-example {
        background: var(--accent);
      }
      .stem {
        display: block;
        margin: var(--space-2) 0 var(--space-3);
        font-size: var(--size-400);
        font-weight: 500;
        color: var(--text-strong);
      }
      .stem {
        font-weight: 500;
        color: var(--text-strong);
      }

      /* ================================ parts ================================= */
      .part {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-4) var(--space-5);
        margin: var(--space-3) 0;
      }
      .qline {
        display: flex;
        gap: var(--space-3);
        align-items: baseline;
      }
      .plabel {
        flex: 0 0 auto;
        font-weight: 600;
        color: var(--accent);
        min-width: 2.4em;
      }

      /* ================================ solution ============================== */
      details.sol {
        margin-top: var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
      }
      details.sol > summary {
        cursor: pointer;
        min-height: var(--control-md);
        padding: var(--space-2) var(--space-4);
        font-weight: 600;
        color: var(--primary);
        font-size: var(--size-300);
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-3);
      }
      details.sol > summary::-webkit-details-marker {
        display: none;
      }
      details.sol > summary::after {
        content: "Show";
        font-weight: 400;
        color: var(--text-chrome);
        font-size: var(--size-200);
      }
      details.sol[open] > summary::after {
        content: "Hide";
      }
      details.sol[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      /* Padding matches the summary exactly, so the step number lines up under the
   word "Solution". */
      .solin {
        padding: var(--space-4);
      }

      /* ---- steps: prose first, then the display ---- */
      ol.steps {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: s;
      }
      ol.steps > li {
        counter-increment: s;
        display: grid;
        grid-template-columns: var(--control-sm) minmax(0, 1fr);
        gap: 0 var(--space-3);
        padding: var(--space-4) 0;
        border-top: 1px solid var(--border);
      }
      ol.steps > li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      /* The number is a small square chip, left-aligned with the summary text above,
   with tabular figures so 9 and 10 keep the same width. */
      ol.steps > li::before {
        content: counter(s);
        grid-column: 1;
        grid-row: 1;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        font-size: var(--size-100);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--primary);
        background: var(--primary-tint);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-xs);
        margin-top: 0.15em;
      }
      .swhy {
        grid-column: 2;
        grid-row: 1;
        color: var(--text-body);
      }
      .smath {
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: var(--space-2) 0 var(--space-1);
      }

      .ans {
        margin-top: var(--space-4);
        padding: var(--space-3) var(--space-4);
        background: var(--primary-tint);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-md);
        color: var(--green-800);
        display: flex;
        gap: var(--space-3);
        align-items: baseline;
      }
      .ans b {
        flex: 0 0 auto;
      }

      /* ---- compact exam-style version ---- */
      .written {
        margin-top: var(--space-4);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
        overflow: hidden;
      }
      .written-head {
        padding: var(--space-2) var(--space-4);
        background: var(--sand-100);
        border-bottom: 1px solid var(--border);
        font-size: var(--size-200);
        font-weight: 600;
        color: var(--text-secondary);
      }
      .written-body {
        padding: var(--space-4);
      }
      .w-say {
        margin: 0 0 var(--space-2);
        color: var(--text-body);
        font-size: var(--size-300);
      }
      /* Each array is its own block, so two separate equations are clearly two
   separate pieces of working rather than one long ladder. */
      .w-math {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        margin: 0 0 var(--space-5);
        padding-bottom: var(--space-1);
      }
      .w-math:last-child {
        margin-bottom: 0;
      }
      .w-say + .w-math {
        margin-top: 0;
      }
      .w-math .katex-display {
        margin: 0;
      }
      .written.is-wide .written-head::after {
        content: "swipe to see the reasons";
        float: right;
        font-weight: 400;
        font-size: var(--size-100);
        color: var(--text-chrome);
      }

      /* Going deeper. Closed by default, but a full-width prominent trigger. The body
   is flat prose under headings, not a stack of cards inside a card. */
      details.deep {
        margin: var(--space-5) 0 var(--space-4);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-lg);
        background: var(--primary-tint);
        overflow: hidden;
      }
      details.deep > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-4) var(--space-5);
        min-height: var(--control-md);
      }
      details.deep > summary::-webkit-details-marker {
        display: none;
      }
      details.deep > summary:hover {
        background: var(--green-100);
      }
      .deep-txt {
        flex: 1 1 auto;
        min-width: 0;
      }
      .deep-t {
        display: block;
        font-size: var(--size-400);
        font-weight: 700;
        color: var(--green-800);
      }
      .deep-s {
        display: block;
        font-size: var(--size-200);
        color: var(--text-secondary);
        margin-top: 2px;
      }
      /* A circular toggle. Round reads as "expand", square reads as "button". */
      .deep-x {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: var(--size-400);
        line-height: 1;
      }
      details.deep[open] .deep-x {
        transform: rotate(45deg);
      }
      .deep-in {
        padding: var(--space-2) var(--space-5) var(--space-5);
        background: var(--surface-raised);
        border-top: 1px solid var(--primary-line);
      }
      .deep-in h3 {
        margin: var(--space-5) 0 var(--space-2);
        font-size: var(--size-400);
      }
      .deep-in h3:first-child {
        margin-top: var(--space-4);
      }
      .deep-in p {
        margin: 0 0 var(--space-3);
        color: var(--text-body);
      }
      .deep-in .rule {
        margin-top: var(--space-3);
      }
      .deep-in .understand {
        background: none;
        border: 0;
        padding: 0;
        margin: 0;
      }

      /* ---- notes stay shut when the solution opens ---- */
      details.notes {
        margin-top: var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
      }
      details.notes > summary {
        cursor: pointer;
        min-height: var(--control-sm);
        display: flex;
        align-items: center;
        padding: var(--space-2) var(--space-4);
        font-size: var(--size-200);
        color: var(--text-secondary);
        font-weight: 500;
        list-style: none;
      }
      details.notes > summary::-webkit-details-marker {
        display: none;
      }
      details.notes > summary::before {
        content: "+";
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin-right: var(--space-2);
        border-radius: var(--radius-xs);
        background: var(--primary-tint);
        color: var(--primary);
        font-weight: 700;
        font-size: var(--size-100);
      }
      details.notes[open] > summary::before {
        content: "−";
      }
      .notesin {
        padding: 0 var(--space-4) var(--space-4);
      }
      .note {
        margin-top: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--size-300);
        border: 1px solid var(--border);
        background: var(--surface-sunken);
        color: var(--text-body);
      }
      .note.watch {
        background: var(--accent-tint);
        border-color: var(--accent-line);
        color: var(--clay-700);
      }
      .note .lbl {
        font-weight: 600;
        display: block;
        margin-bottom: var(--space-1);
      }

      /* ---- video solution ----------------------------------------------------
   The same disclosure shape as Solution, one level quieter, because the video
   is another route to the same working and must never outrank the written
   one. It sits beside the solution rather than inside it, so a student can
   watch without the answer being uncovered first.
   The player does not exist until the panel is opened, and is thrown away
   when it closes. That is what keeps a page of forty parts free of forty
   third-party players, and it is also what stops the sound when a student
   shuts the panel. */
      details.vid {
        margin-top: var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
      }
      details.vid > summary {
        cursor: pointer;
        min-height: var(--control-md);
        list-style: none;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-4);
        font-size: var(--size-300);
      }
      details.vid > summary::-webkit-details-marker {
        display: none;
      }
      details.vid > summary:hover {
        background: var(--surface-sunken);
      }
      details.vid > summary::after {
        content: "Watch";
        margin-left: auto;
        font-weight: 400;
        color: var(--text-chrome);
        font-size: var(--size-200);
      }
      details.vid[open] > summary::after {
        content: "Close";
      }
      details.vid[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      /* A circle says play, the way a circle says expand elsewhere in the book. It
   is a solid fill inside a control, which is the one place a solid fill is
   allowed. */
      .vid-play {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--primary);
        display: grid;
        place-items: center;
      }
      .vid-play::before {
        content: "";
        width: 0;
        height: 0;
        margin-left: 2px;
        border-left: 8px solid #fff;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      .vid-lab {
        min-width: 0;
        font-weight: 600;
        color: var(--text-strong);
      }
      /* The running time is on the trigger, so a student knows what opening it
   costs before it starts. */
      .vid-dur {
        flex: 0 0 auto;
        font-size: var(--size-100);
        font-variant-numeric: tabular-nums;
        color: var(--primary);
        background: var(--primary-tint);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-xs);
        padding: 0 var(--space-2);
      }
      .vidin {
        padding: var(--space-4);
      }
      .vid-frame {
        position: relative;
        aspect-ratio: 16/9;
        overflow: hidden;
        background: var(--brown-900);
        border-radius: var(--radius-md);
      }
      @supports not (aspect-ratio: 16/9) {
        .vid-frame {
          height: 0;
          padding-top: 56.25%;
        }
      }
      /* Centred and, when the file carries its own black padding, scaled up until
   that padding sits outside the box. The default is 100% by 100%, so a video
   that was never padded is untouched. */
      .vid-frame iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: var(--vid-w, 100%);
        height: var(--vid-h, 100%);
        border: 0;
        display: block;
      }
      .vid-alt {
        margin: var(--space-3) 0 0;
        font-size: var(--size-200);
        color: var(--text-chrome);
      }
      .vid-alt a {
        color: var(--primary);
        font-weight: 500;
      }
      details.vid[hidden] {
        display: none;
      }

      /* ================================ concepts ============================== */
      .defn {
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
        border-left: 4px solid var(--primary);
        border-radius: var(--radius-lg);
        padding: var(--space-4) var(--space-5);
        margin: 0 0 var(--space-5);
      }
      .defn-tag {
        display: inline-block;
        font-size: var(--size-100);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: var(--space-2);
      }
      .defn h3 {
        margin-bottom: var(--space-3);
      }
      .defn-body {
        color: var(--text-body);
      }
      .defn-body p {
        margin: 0 0 var(--space-3);
      }
      .defn-note {
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid var(--border);
      }
      .defn-note p {
        margin: 0 0 var(--space-2);
        color: var(--text-secondary);
        font-size: var(--size-300);
      }
      .eg {
        margin-top: var(--space-3);
        background: var(--primary-tint);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-sm);
        padding: var(--space-3) var(--space-4);
      }
      .eg .lbl {
        font-size: var(--size-100);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 700;
        color: var(--green-800);
        display: block;
        margin-bottom: var(--space-2);
      }
      .eg ul {
        margin: 0;
        padding-left: var(--space-5);
      }
      .eg li {
        margin: 0 0 var(--space-1);
        color: var(--text-body);
      }

      .understand {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-4) var(--space-5);
        margin: 0 0 var(--space-4);
      }
      .understand p {
        margin: 0 0 var(--space-3);
        color: var(--text-body);
      }
      .understand p:last-child {
        margin-bottom: 0;
      }
      .rule {
        background: var(--primary-tint);
        border: 1px solid var(--primary-line);
        border-radius: var(--radius-sm);
        padding: var(--space-3) var(--space-4);
        margin-top: var(--space-4);
      }
      .rule b {
        color: var(--green-800);
      }

      details.extra {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
        margin-top: var(--space-4);
      }
      details.extra > summary {
        cursor: pointer;
        min-height: var(--control-md);
        display: flex;
        align-items: center;
        padding: var(--space-2) var(--space-5);
        font-weight: 600;
        color: var(--text-secondary);
        font-size: var(--size-300);
        list-style: none;
      }
      details.extra > summary::-webkit-details-marker {
        display: none;
      }
      details.extra > summary::before {
        content: "+";
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-right: var(--space-3);
        border-radius: var(--radius-xs);
        background: var(--sand-300);
        color: var(--text-secondary);
        font-weight: 700;
        font-size: var(--size-100);
      }
      details.extra[open] > summary::before {
        content: "−";
      }
      .extrain {
        padding: 0 var(--space-5) var(--space-4);
      }
      .extrain p {
        color: var(--text-body);
      }
      table.corr {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--size-300);
        margin-top: var(--space-3);
      }
      table.corr th,
      table.corr td {
        text-align: left;
        vertical-align: top;
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border);
      }
      table.corr th {
        font-weight: 600;
        color: var(--text-secondary);
        font-size: var(--size-200);
      }

      /* ================================ chrome ================================ */
      /* Round, because it is an icon control rather than a labelled button.
   On a wide screen it sits in the margin just right of the measure, so it never
   covers content. On a narrow screen there is no margin, so it returns to the
   corner. */
      #toTop {
        position: fixed;
        bottom: var(--space-5);
        z-index: 50;
        /* --content-half is measured at run time. A ch-based calc here would resolve
     against the ROOT font size, not the body's, and land the button on top of
     the text. */
        left: calc(50% + var(--content-half, 50vw) + var(--space-4));
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid var(--border-strong);
        background: var(--surface-raised);
        color: var(--primary);
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(36, 26, 16, 0.14);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          visibility 0.18s ease,
          background 0.12s ease,
          transform 0.12s ease;
      }
      #toTop svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      #toTop.on {
        opacity: 1;
        visibility: visible;
      }
      #toTop:hover {
        background: var(--primary);
        color: #fff;
        transform: translateY(-2px);
      }
      #toTop:active {
        transform: translateY(0);
      }
      /* Not enough margin to sit clear of the text: fall back to the corner. */
      #toTop.corner {
        left: auto;
        right: var(--space-4);
      }

      .katex-display {
        margin: var(--space-2) 0;
      }
      .katex {
        font-size: 1.05em;
      }
      .placeholder {
        background: var(--surface-raised);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        text-align: center;
        color: var(--text-secondary);
      }

      @media (max-width: 520px) {
        /* overflow-x:hidden here would make html a scroll container, and every
     position:sticky descendant would then compute against a box that never
     scrolls, so nothing would pin on a phone. overflow-x:clip contains the
     same overflow without creating that container, so sticky keeps working. */
        html,
        body {
          overflow-x: clip;
          max-width: 100%;
        }
        body {
          font-size: 1.0625rem;
        }
        :root {
          --size-700: 1.625rem;
          --size-600: 1.4375rem;
          --size-500: 1.25rem;
        }
        ol.steps > li {
          grid-template-columns: 30px minmax(0, 1fr);
          gap: 0 var(--space-2);
        }
        ol.steps > li::before {
          width: 24px;
          height: 24px;
        }
        .part {
          padding: var(--space-4);
        }
        .defn,
        .understand {
          padding: var(--space-4);
        }
        .ans {
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media print {
        .tabs-wrap,
        .local-jump,
        #toTop,
        .skip {
          display: none !important;
        }
        details .solin,
        details .notesin,
        details .extrain,
        details .vidin {
          display: block !important;
        }
        details.sol,
        details.notes,
        details.extra,
        details.vid {
          border: 0;
          background: none;
        }
        [role="tabpanel"][hidden] {
          display: block !important;
        }
        .grp {
          position: static;
          box-shadow: none;
        }
        /* Paper cannot play a video, so print the address instead of a black box. */
        .vid-frame,
        .vid-play,
        .vid-dur,
        details.vid > summary::after {
          display: none !important;
        }
        .vidin {
          padding: 0;
        }
        .vid-alt a::after {
          content: " (" attr(href) ")";
        }
      }

      /* ==========================================================================
   BOOK VIEW  (contents). Same tokens, so the two views cannot drift apart.
   ========================================================================== */
      .view[hidden] {
        display: none;
      }
      .hero {
        padding: var(--space-6) 0 var(--space-5);
      }
      .hero h1 {
        font-size: var(--size-700);
        line-height: var(--leading-tight);
        margin: var(--space-2) 0;
        color: var(--text-strong);
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      .hero .sub {
        margin: 0;
        color: var(--text-secondary);
        font-size: var(--size-300);
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        margin-top: var(--space-5);
      }
      .stat {
        flex: 1 1 7rem;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
      }
      .stat b {
        display: block;
        font-size: var(--size-600);
        color: var(--primary);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .ucard {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        margin-bottom: var(--space-3);
        overflow: hidden;
      }
      .ucard.is-idle {
        opacity: 0.72;
      }
      .u-link,
      .u-body {
        display: block;
        padding: var(--space-4) var(--space-5);
        text-decoration: none;
        color: inherit;
        width: 100%;
        text-align: left;
        font: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .u-body {
        cursor: default;
      }
      .u-link:hover {
        background: var(--primary-tint);
      }
      .u-head {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .u-num {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: #fff;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .u-head h2 {
        margin: 0;
        font-size: var(--size-500);
        border: 0;
        padding: 0;
        font-weight: 600;
      }
      .u-meta {
        margin: 2px 0 0;
        font-size: var(--size-200);
        color: var(--text-chrome);
      }
      .u-badge {
        margin-left: auto;
        font-size: var(--size-100);
        font-weight: 600;
        padding: 2px var(--space-2);
        border-radius: var(--radius-xs);
        white-space: nowrap;
      }
      .s-in-progress {
        background: var(--primary-tint);
        color: var(--green-800);
        border: 1px solid var(--primary-line);
      }
      .s-not-started {
        background: var(--sand-100);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .s-not-surveyed {
        background: var(--accent-tint);
        color: var(--clay-700);
        border: 1px solid var(--accent-line);
      }
      .u-ex {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin: var(--space-3) 0 0;
        padding: 0;
      }
      .u-ex li {
        font-size: var(--size-200);
        padding: 2px var(--space-2);
        border-radius: var(--radius-xs);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: var(--surface-sunken);
      }
      .u-ex li.is-done {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        font-weight: 600;
      }
      .u-bar {
        height: 5px;
        background: var(--sand-300);
        border-radius: var(--radius-xs);
        margin-top: var(--space-3);
        overflow: hidden;
      }
      .u-bar span {
        display: block;
        height: 100%;
        background: var(--primary);
      }
      .u-prog {
        margin: var(--space-2) 0 0;
        font-size: var(--size-200);
        color: var(--text-chrome);
      }
      .prov {
        margin: var(--space-2) 0 0;
        font-size: var(--size-200);
        color: var(--clay-700);
      }
      .foot {
        margin: var(--space-6) 0 var(--space-8);
        padding-top: var(--space-4);
        border-top: 1px solid var(--border);
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      @media (min-width: 48rem) {
        .hero h1 {
          font-size: 2.5rem;
        }
      }
      @media print {
        .view[hidden] {
          display: none !important;
        }
      }

      /* ==========================================================================
   MOBILE STICKY
   The masthead scrolls away with the page. Taking it out of flow with
   position:fixed breaks the sticky context of the bars below it, so instead the
   three sticky levels simply pin in order, and each level is made shorter on a
   phone so the whole stack stays near 100px.
   ========================================================================== */
      @media (max-width: 47.99rem) {
        [role="tab"] {
          min-height: 38px;
          padding: 0 var(--space-3);
        }
        [role="tablist"] {
          padding: var(--space-1) 0 var(--space-2);
        }
        .local-jump {
          padding: var(--space-2) 0;
        }
        .local-jump a {
          min-height: 32px;
          padding: 0 var(--space-3);
          font-size: var(--size-100);
        }
        .grp {
          padding: var(--space-2) 0;
        }
      }

      /* ==========================================================================
   SEARCH RESULTS
   ========================================================================== */
      .results {
        margin-top: var(--space-4);
      }
      .results[hidden] {
        display: none;
      }
      .res-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin-bottom: var(--space-3);
      }
      .res-head h2 {
        margin: 0;
        font-size: var(--size-500);
        border: 0;
        padding: 0;
      }
      .res-clear {
        appearance: none;
        border: 1px solid var(--border-strong);
        background: var(--surface-raised);
        color: var(--text-secondary);
        font: inherit;
        font-size: var(--size-200);
        min-height: var(--control-sm);
        padding: 0 var(--space-3);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .res-clear:hover {
        background: var(--sand-300);
        color: var(--text-strong);
      }
      .res-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .res-item {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-2);
      }
      .res-item a {
        display: block;
        padding: var(--space-3) var(--space-4);
        text-decoration: none;
        color: inherit;
      }
      .res-item a:hover {
        background: var(--primary-tint);
      }
      .res-where {
        font-size: var(--size-100);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--primary);
        font-weight: 700;
        display: block;
        margin-bottom: var(--space-1);
      }
      .res-text {
        color: var(--text-body);
        display: block;
      }
      .res-none {
        background: var(--surface-raised);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        padding: var(--space-5);
        color: var(--text-secondary);
      }
      .flash {
        animation: flash 1.6s ease;
      }
      @keyframes flash {
        0%,
        40% {
          background: #fdf0a8;
        }
        100% {
          background: transparent;
        }
      }

      /* ==========================================================================
   MCQ (review exercise, unit test, generated papers)
   ========================================================================== */
      .opts {
        list-style: none;
        margin: var(--space-3) 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-2);
      }
      @media (min-width: 34rem) {
        .opts {
          grid-template-columns: 1fr 1fr;
        }
      }
      .opts li {
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        color: var(--text-body);
      }
      .opt-k {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xs);
        font-size: var(--size-100);
        font-weight: 700;
        color: var(--text-secondary);
        background: var(--surface-raised);
      }
      .opts li.is-right {
        background: var(--primary-tint);
        border-color: var(--primary-line);
      }
      .opts li.is-right .opt-k {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .why-wrong {
        margin-top: var(--space-3);
      }
      .why-wrong .lbl {
        font-weight: 600;
        display: block;
        margin-bottom: var(--space-2);
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .why-wrong ul {
        margin: 0;
        padding-left: var(--space-5);
      }
      .why-wrong li {
        margin-bottom: var(--space-2);
        color: var(--text-body);
        font-size: var(--size-300);
      }

      /* ==========================================================================
   PAPER  (unit test and generated papers)
   ========================================================================== */
      .paper {
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .paper-head {
        padding: var(--space-5);
        border-bottom: 2px solid var(--text-strong);
        text-align: center;
      }
      .paper-head h3 {
        margin: 0;
        font-size: var(--size-600);
        font-weight: 700;
      }
      .paper-head .school {
        font-size: var(--size-200);
        color: var(--text-secondary);
        margin: 0 0 var(--space-1);
      }
      .paper-rail {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--space-2) var(--space-5);
        margin-top: var(--space-3);
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .paper-rail b {
        color: var(--text-strong);
        font-variant-numeric: tabular-nums;
      }
      .paper-body {
        padding: var(--space-5);
      }
      .sec {
        margin-bottom: var(--space-6);
      }
      .sec:last-child {
        margin-bottom: 0;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        flex-wrap: wrap;
        padding-bottom: var(--space-2);
        border-bottom: 1px solid var(--border-strong);
        margin-bottom: var(--space-3);
      }
      .sec-head h4 {
        margin: 0;
        font-size: var(--size-400);
        font-weight: 700;
        color: var(--text-strong);
      }
      .sec-marks {
        margin-left: auto;
        font-size: var(--size-200);
        font-weight: 600;
        color: var(--primary);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .sec-note {
        width: 100%;
        margin: 0;
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .pq {
        display: grid;
        grid-template-columns: 2.6em minmax(0, 1fr);
        gap: 0 var(--space-2);
        padding: var(--space-3) 0;
        border-bottom: 1px dashed var(--border);
      }
      .pq:last-child {
        border-bottom: 0;
      }
      .pq-n {
        color: var(--text-chrome);
        font-size: var(--size-200);
        font-variant-numeric: tabular-nums;
        padding-top: 0.15em;
      }
      .pq-body {
        min-width: 0;
      }
      /* auto-fit rather than a fixed four columns: a long option such as
   "x = 0 and y != 0" then gets a wider cell instead of wrapping mid-phrase. */
      .pq-opts {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: var(--space-2) var(--space-4);
        margin: var(--space-2) 0 0;
        padding: 0;
        font-size: var(--size-300);
      }
      .pq-opts li span {
        color: var(--text-chrome);
        font-weight: 600;
        margin-right: var(--space-1);
      }
      .paper-tools {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-top: var(--space-4);
      }

      /* ==========================================================================
   BUTTONS  (generator, paper actions)
   ========================================================================== */
      .btn {
        appearance: none;
        font: inherit;
        font-size: var(--size-200);
        font-weight: 600;
        min-height: var(--control-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: 0 var(--space-5);
        border-radius: var(--radius-md);
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.12s ease;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 1px 2px rgba(17, 84, 66, 0.28);
      }
      .btn-primary:hover {
        background: var(--green-800);
      }
      .btn-ghost {
        background: var(--surface-raised);
        border-color: var(--border-strong);
        color: var(--text-secondary);
      }
      .btn-ghost:hover {
        background: var(--sand-300);
        color: var(--text-strong);
      }

      /* ==========================================================================
   GENERATOR CONTROLS
   ========================================================================== */
      .gen-form {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-5);
        margin-bottom: var(--space-5);
      }
      .field {
        margin-bottom: var(--space-5);
      }
      .field:last-of-type {
        margin-bottom: var(--space-4);
      }
      .field > .lbl {
        display: block;
        font-size: var(--size-200);
        font-weight: 600;
        color: var(--text-strong);
        margin-bottom: var(--space-1);
      }
      .field .hint {
        margin: 0 0 var(--space-3);
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .choice {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      .choice label {
        flex: 1 1 12rem;
        min-height: var(--control-md);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-4);
        cursor: pointer;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        font-size: var(--size-200);
      }
      .choice input {
        accent-color: var(--primary);
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .choice label:has(input:checked) {
        background: var(--primary-tint);
        border-color: var(--primary);
        color: var(--green-800);
        font-weight: 600;
      }
      .choice label:has(input:focus-visible) {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }
      .mix {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }
      .mix label {
        flex: 1 1 7rem;
      }
      .mix span {
        display: block;
        font-size: var(--size-200);
        color: var(--text-secondary);
        margin-bottom: var(--space-1);
      }
      .mix input {
        width: 100%;
        min-height: var(--control-md);
        font: inherit;
        font-size: var(--size-300);
        padding: 0 var(--space-3);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        color: var(--text-body);
        font-variant-numeric: tabular-nums;
      }
      .gen-status {
        margin: var(--space-3) 0 0;
        font-size: var(--size-200);
        color: var(--text-secondary);
      }
      .warn {
        background: var(--accent-tint);
        border: 1px solid var(--accent-line);
        color: var(--clay-700);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        font-size: var(--size-300);
        margin-bottom: var(--space-4);

      @media print {
        .gen-form,
        .paper-tools,
        .res-clear {
          display: none !important;

        .paper {
          border: 0;
        }
        .paper-head {
          border-bottom: 2px solid #000;
        }

      /* ==========================================================================
   INTERACTIVE MCQ  (review exercise)
   ========================================================================== */
      .mcq-opts {
        list-style: none;
        margin: var(--space-3) 0 0;
        padding: 0;
        display: grid;
        gap: var(--space-2);
      }
      @media (min-width: 34rem) {
        .mcq-opts {
          grid-template-columns: 1fr 1fr;
        }
      }
      .mcq-opts button {
        width: 100%;
        display: flex;
        gap: var(--space-3);
        align-items: center;
        text-align: left;
        font: inherit;
        font-size: var(--size-300);
        color: var(--text-body);
        cursor: pointer;
        min-height: var(--control-md);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .mcq-opts button:hover:not([disabled]) {
        background: var(--sand-300);
      }
      .mcq-k {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        background: var(--surface-raised);
        font-size: var(--size-200);
        font-weight: 700;
        color: var(--text-secondary);
      }
      .mcq-opts button.right {
        background: var(--primary-tint);
        border-color: var(--primary);
        color: var(--green-800);
        font-weight: 600;
      }
      .mcq-opts button.right .mcq-k {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .mcq-opts button.right::after {
        content: "\2713";
        margin-left: auto;
        color: var(--primary);
        font-weight: 700;
      }
      .mcq-opts button.wrong {
        background: #fdeceb;
        border-color: #c0392b;
        color: #8e2a1f;
        font-weight: 600;
      }
      .mcq-opts button.wrong .mcq-k {
        background: #c0392b;
        border-color: #c0392b;
        color: #fff;
      }
      .mcq-opts button.wrong::after {
        content: "\2715";
        margin-left: auto;
        color: #c0392b;
        font-weight: 700;
      }
      .mcq-opts button[disabled] {
        cursor: default;
      }
      .mcq-verdict {
        margin: var(--space-3) 0 0;
        font-size: var(--size-300);
        font-weight: 600;
        padding: var(--space-2) var(--space-3) var(--space-2) var(--space-4);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      .mcq-verdict[hidden] {
        display: none;
      }
      .mcq-verdict.ok {
        background: var(--primary-tint);
        color: var(--green-800);
        border: 1px solid var(--primary-line);
      }
      .mcq-verdict.no {
        background: #fdeceb;
        color: #8e2a1f;
        border: 1px solid #f0c4bf;
      }
      /* Sits on the same line as the verdict, pushed to the right. */
      .mcq-retry {
        margin-left: auto;
        appearance: none;
        background: none;
        font: inherit;
        font-size: var(--size-100);
        font-weight: 600;
        cursor: pointer;
        color: inherit;
        min-height: var(--control-sm);
        padding: 0 var(--space-3);
        border: 1px solid currentColor;
        border-radius: var(--radius-pill);
        opacity: 0.7;
      }
      .mcq-retry:hover {
        opacity: 1;
      }
      details.sol[hidden] {
        display: none;
      }

      /* ==========================================================================
   SEARCH RESULTS  sit above the unit navigation, never inside a panel
   ========================================================================== */
      #results {
        margin: 0 auto;
        padding: var(--space-5) var(--space-4) var(--space-6);
        max-width: calc(var(--measure) + var(--space-8));
      }

        display: none;
      }
      .res-item a {
        border-radius: var(--radius-md);
      }
      .res-where {
        color: var(--primary);
      }

      .choice.checks label {
        flex: 1 1 9rem;
      }
      .choice input[type="checkbox"] {
        accent-color: var(--primary);
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .choice label.is-off {

      .choice label:has(input:disabled) {
        cursor: not-allowed;
      }
      .btn-sm {
        min-height: var(--control-sm);
        font-size: var(--size-100);
        padding: 0 var(--space-4);
        border-radius: var(--radius-pill);
      }
      #lengths[hidden] {
        display: none;
      }

                        "math": "\\begin{aligned}(3-2i)(x+yi) &= 3x+3yi-2xi-2yi^{2} \\\\ &= 3x+3yi-2xi+2y && \\fcolorbox{#115442}{#fffdf8}{\\footnotesize\\textcolor{#115442}{$i^{2}=-1$}} \\\\ &= (3x+2y)+(3y-2x)i \\\\ 2(x-2yi)+2i-1 &= 2x-4yi+2i-1 \\\\ &= (2x-1)+(2-4y)i \\\\ 3x+2y &= 2x-1 && \\fcolorbox{#115442}{#fffdf8}{\\footnotesize\\textcolor{#115442}{$\\text{comparing real parts}$}} \\\\ x+2y &= -1 \\qquad \\cdots(1) \\\\ 3y-2x &= 2-4y && \\fcolorbox{#115442}{#fffdf8}{\\footnotesize\\textcolor{#115442}{$\\text{comparing imaginary parts}$}} \\\\ -2x+7y &= 2 \\qquad \\cdots(2) \\\\ x &= -1-2y \\\\ -2(-1-2y)+7y &= 2 \\\\ 2+4y+7y &= 2 \\\\ 2+11y &= 2 \\\\ 11y &= 0 \\\\ y &= 0 \\\\ x &= -1-2(0) = -1 \\\\ &= -1, \\qquad y = 0\\end{aligned}"
                      }
                    ],
                    "notes": {
                      "check": {
                        "math": "\\begin{aligned}(3-2i)(-1+0i) &= -3+2i \\\\ 2(-1-0)+2i-1 &= -3+2i \\quad \\checkmark\\end{aligned}",
                        "why": "Put $x=-1$ and $y=0$ into each side on its own. Both come to $-3+2i$, so the answers are correct."
                      },
                      "watchOut": "An answer of $y=0$ is a real answer, not a missing one. It says the number $x+yi$ turns out to be the real number $-1$."
                    }
                  }
                ]
              }
            ],
            "stubs": []
          }
        }
      }
    </script>

    <script id="banks-data" type="application/json">
      {
        "1": {
          "ready": false,
