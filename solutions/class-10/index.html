    <script>
      "use strict";
      const BOOK = JSON.parse(document.getElementById("book-data").textContent);
      const CONTENT = JSON.parse(
        document.getElementById("content-data").textContent,
      );
      const PAPERS = JSON.parse(
        document.getElementById("papers-data").textContent,
      );
      const BANKS = JSON.parse(
        document.getElementById("banks-data").textContent,
      );

      let TABS = []; /* tabs for the unit currently open */
      let CURRENT_UNIT = null;
      let updateFade = () => {};

      /* ======================================================================
   BOOK VIEW
   ====================================================================== */
      function renderBook() {
        const units = BOOK.units;
        const done = units.reduce((a, u) => a + u.done.length, 0);
        const total = units.reduce((a, u) => a + u.exercises.length, 0);
        const surveyed = units.filter((u) => u.verified).length;

        document.getElementById("stats").innerHTML = [
          [units.length, "units"],
          [total, "exercises"],
          [done, "written so far"],
          [surveyed, "units surveyed"],
        ]
          .map(
            ([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`,
          )
          .join("");

        document.getElementById("units").innerHTML = units
          .map((u) => {
            const pct = u.exercises.length
              ? Math.round((100 * u.done.length) / u.exercises.length)
              : 0;
            const live = !!(CONTENT[u.n] && Object.keys(CONTENT[u.n]).length);
            const badge = {
              "in-progress": "In progress",
              "not-started": "Not started",
              "not-surveyed": "Not surveyed",
            }[u.status];
            const chips = u.exercises
              .map(
                (e) =>
                  `<li class="${u.done.includes(e) ? "is-done" : ""}">${e}</li>`,
              )
              .join("");
            const prov = u.verified
              ? ""
              : `<p class="prov">Exercise list is provisional. This unit has not been surveyed page by page yet.</p>`;
            const inner = `
      <div class="u-head">
        <span class="u-num">${u.n}</span>
        <div><h2>${u.title}</h2>
          <p class="u-meta">Book pages ${u.pages[0]} to ${u.pages[1]}
             &middot; ${u.exercises.length} exercise${u.exercises.length === 1 ? "" : "s"}</p></div>
        <span class="u-badge s-${u.status}">${badge}</span>
      </div>
      <ul class="u-ex">${chips}</ul>
      <div class="u-bar"><span style="width:${pct}%"></span></div>
      <p class="u-prog">${u.done.length} of ${u.exercises.length} written</p>${prov}`;
            return (
              `<article class="ucard${live ? "" : " is-idle"}">` +
              (live
                ? `<a class="u-link" href="#/unit-${u.n}">${inner}</a>`
                : `<div class="u-body">${inner}</div>`) +
              `</article>`
            );
          })
          .join("");

        const ps = BOOK.backMatter.find((b) => /Pairing/.test(b.title));
        document.getElementById("foot").innerHTML =
          `Unit titles and page numbers follow the Table of Contents in the PECTAA Class 10
     Mathematics textbook. The paper pattern follows the Pairing Scheme printed on
     book page ${ps ? ps.page : ""}.`;
      }

      /* ======================================================================
   UNIT VIEW : content rendering
   ====================================================================== */
      function stepsHTML(list) {
        return (
          `<ol class="steps">` +
          list
            .map(
              (s) =>
                `<li><div class="swhy">${s.why}</div><div class="smath">$$${s.math}$$</div></li>`,
            )
            .join("") +
          `</ol>`
        );
      }
      /* A written solution is a sequence of blocks: short sentences where they help,
   aligned arrays for the working. Two separate equations therefore become two
   arrays with a line between them, which is what gives them room to breathe. */
      function writtenHTML(blocks) {
        if (!blocks || !blocks.length) return "";
        const body = blocks
          .map((b) =>
            b.say
              ? `<p class="w-say">${b.say}</p>`
              : `<div class="w-math">$$${b.math}$$</div>`,
          )
          .join("");
        return `<div class="written">
    <div class="written-head">Compact solution</div>
    <div class="written-body">${body}</div></div>`;
      }
      function notesHTML(n) {
        if (!n) return "";
        const bits = [],
          labels = [];
        if (n.check) {
          bits.push(`<div class="note"><span class="lbl">Check the answer</span>
      <div class="smath">$$${n.check.math}$$</div><div>${n.check.why}</div></div>`);
          labels.push("check");
        }
        if (n.watchOut) {
          bits.push(
            `<div class="note watch"><span class="lbl">Watch out</span>${n.watchOut}</div>`,
          );
          labels.push("common mistake");
        }
        if (n.shortcut) {
          bits.push(
            `<div class="note"><span class="lbl">A quicker way, once you are confident</span>${n.shortcut}</div>`,
          );
          labels.push("shortcut");
        }
        if (n.alsoAcceptable) {
          bits.push(
            `<div class="note"><span class="lbl">Also correct</span>${n.alsoAcceptable}</div>`,
          );
          labels.push("other forms");
        }
        if (!bits.length) return "";
        return `<details class="notes"><summary>More on this part: ${labels.join(", ")}</summary>
          <div class="notesin">${bits.join("")}</div></details>`;
      }
      /* A video solution is a second route to the same working, so it sits beside
   the written solution, not inside it. A student who wants to watch can do so
   without first uncovering the answer, and a student who never watches sees
   one quiet extra line.
   The content file stores the bare video id, never an embed URL and never a
   pasted <iframe>. Building the player here is what keeps privacy mode, the
   aspect ratio, the accessible name and lazy loading in one place. */
      const VIDEO = {
        youtube: {
          site: "YouTube",
          embed: (v) =>
            `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0&modestbranding=1${v.start ? `&start=${encodeURIComponent(v.start)}` : ""}`,
          page: (v) =>
            `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`,
        },
        vimeo: {
          site: "Vimeo",
          embed: (v) =>
            `https://player.vimeo.com/video/${encodeURIComponent(v.id)}${v.start ? `#t=${encodeURIComponent(v.start)}s` : ""}`,
          page: (v) => `https://vimeo.com/${encodeURIComponent(v.id)}`,
        },
      };
      /* A recording is often padded to sixteen by nine before it is uploaded, so the
   file itself carries black bars. `aspect` is the size of the real picture
   inside that frame, measured with measure_video.py. The box is then given the
   picture's own shape and the player is scaled until the padding falls outside
   it, which is the only way to remove bars that are part of the video.
   Without `aspect` nothing is scaled and the player fills a sixteen by nine
   box, which is right for a video that was never padded. */
      function videoFit(v) {
        const a = v.aspect;
        if (!Array.isArray(a) || a.length !== 2 || !(a[0] > 0) || !(a[1] > 0))
          return "";
        const pic = a[0] / a[1],
          frame = 16 / 9;
        const pct = (n) => (n * 100).toFixed(3) + "%";
        return (
          ` style="aspect-ratio:${a[0]}/${a[1]};` +
          `--vid-w:${pct(pic < frame ? frame / pic : 1)};` +
          `--vid-h:${pct(pic > frame ? pic / frame : 1)}"`
        );
      }
      function videoHTML(v) {
        if (!v || !v.id) return "";
        const host = VIDEO[v.kind] || VIDEO.youtube;
        const label = v.title || "Video solution";
        /* The summary is typeset, so its title may carry LaTeX. An iframe title is
     an attribute and is never typeset, so it gets the delimiters stripped. */
        const name = label.replace(/[$\\{}]/g, "").replace(/"/g, "&quot;");
        return `<details class="vid">
    <summary><span class="vid-play" aria-hidden="true"></span>
      <span class="vid-lab">${label}</span>
      ${v.duration ? `<span class="vid-dur">${v.duration}</span>` : ""}</summary>
    <div class="vidin">
      <div class="vid-frame"${videoFit(v)} data-src="${host.embed(v).replace(/&/g, "&amp;")}" data-title="${name}"></div>
      <p class="vid-alt"><a href="${host.page(v)}" target="_blank" rel="noopener">Open this video on ${host.site}</a> if it does not play here.</p>
    </div></details>`;
      }
      /* The player is created when the panel opens and destroyed when it closes.
   Forty parts therefore cost nothing until a student asks for one, and
   shutting the panel stops the sound, which is what shutting it means. */
      function wireVideos(root) {
        root.querySelectorAll("details.vid").forEach((d) => {
          const box = d.querySelector(".vid-frame");
          d.addEventListener("toggle", () => {
            if (!d.open) {
              box.textContent = "";
              return;
            }
            if (box.firstChild) return;
            const f = document.createElement("iframe");
            f.src = box.dataset.src;
            f.title = box.dataset.title;
            f.loading = "lazy";
            f.allow =
              "clipboard-write; encrypted-media; picture-in-picture; web-share";
            f.referrerPolicy = "strict-origin-when-cross-origin";
            f.allowFullscreen = true;
            box.appendChild(f);
          });
        });
      }
      function partHTML(p) {
        const q = p.question
          ? `<div class="qline"><span class="plabel">${p.label || ""}</span><span>${p.question}</span></div>`
          : "";
        return `<article class="part"${p.id ? ` id="${p.id}"` : ""}>${q}
    <details class="sol"><summary>Solution</summary><div class="solin">
      ${stepsHTML(p.steps)}
      <div class="ans"><b>Answer</b><span>${p.answer}</span></div>
      ${writtenHTML(p.written)}
      ${notesHTML(p.notes)}
    </div></details>
    ${videoHTML(p.video)}</article>`;
      }
      function blockHTML(label, stem, parts, isExample) {
        return `<section class="qblock">
    <div class="grp"><span class="qn${isExample ? " is-example" : ""}">${label}</span></div>
    ${stem ? `<p class="stem">${stem}</p>` : ""}
    ${parts.map(partHTML).join("")}</section>`;
      }

      /* Concepts is ONE section: definitions, then explanations, then the extras. */
      function conceptsHTML(d, pid) {
        let h = `<section class="flow-section" id="${pid}-concepts"><header class="flow-head"><h2>Concepts</h2>
    <p class="lede">The definitions come first, because these are what the paper asks for. The explanations follow.</p></header>`;
        (d.definitions || []).forEach((def) => {
          h += `<div class="defn"><span class="defn-tag">Definition</span>
      <h3>${def.term}</h3>
      <div class="defn-body"><p>${def.statement}</p></div>
      ${def.notes && def.notes.length ? `<div class="defn-note">${def.notes.map((n) => `<p>${n}</p>`).join("")}</div>` : ""}
      ${
        def.examples && def.examples.length
          ? `<div class="eg"><span class="lbl">Examples</span>
        <ul>${def.examples.map((e) => `<li>${e}</li>`).join("")}</ul></div>`
          : ""
      }</div>`;
        });
        /* Going deeper holds the derivations AND the history. Both are theory, so
     they belong in one place rather than two separate disclosures. Closed by
     default, with a prominent full-width trigger. */
        const deep = (d.whyItWorks || []).concat(d.history || []);
        if (deep.length) {
          h +=
            `<details class="deep"><summary>
        <span class="deep-txt">
          <span class="deep-t">Going deeper</span>
          <span class="deep-s">${deep.length} sections &middot; where every rule above comes from, and where the idea came from</span>
        </span>
        <span class="deep-x" aria-hidden="true">+</span>
      </summary><div class="deep-in">` +
            deep
              .map(
                (u) =>
                  `<h3>${u.title}</h3>` +
                  u.body.map((b) => `<p>${b}</p>`).join("") +
                  (u.rule
                    ? `<div class="rule"><b>Rule.</b> ${u.rule.statement}<br>${u.rule.example}</div>`
                    : ""),
              )
              .join("") +
            `</div></details>`;
        }
        return h + `</section>`;
      }

      function exercisePanel(d, pid) {
        let h = `<nav class="local-jump" aria-label="Inside Exercise ${d.exercise}">
      <div class="seg">
        <a href="#${pid}-concepts">Concepts</a>
        <a href="#${pid}-examples">Examples</a>
        <a href="#${pid}-exercise">Exercise</a>
      </div></nav>`;
        h += conceptsHTML(d, pid);
        h += `<section class="flow-section" id="${pid}-examples"><header class="flow-head"><h2>Examples</h2>
        <p class="lede">The textbook's examples, worked out in full in our own words.</p></header>`;
        d.examples.forEach((e) => {
          h += blockHTML(e.label, e.stem, e.parts, true);
        });
        h += `</section><section class="flow-section" id="${pid}-exercise"><header class="flow-head"><h2>Exercise ${d.exercise}</h2></header>`;
        d.questions.forEach((q) => {
          h += blockHTML("Question " + q.number, q.stem, q.parts, false);
        });
        return h + `</section>`;
      }

      /* ======================================================================
   REVIEW EXERCISE
   ====================================================================== */
      const ROMAN = (n) =>
        [
          "i",
          "ii",
          "iii",
          "iv",
          "v",
          "vi",
          "vii",
          "viii",
          "ix",
          "x",
          "xi",
          "xii",
        ][n] || String(n + 1);
      const KEYS = ["a", "b", "c", "d"];

      /* An MCQ behaves like an online test: tap an option and it answers back at
   once, marking your choice and showing the correct one. The solution below
   holds only the compact working and the reasons the other options fail. There
   is no separate answer box, because the marked option already is the answer. */
      function mcqHTML(pt, n) {
        const opts = pt.options
          .map(
            (o, i) =>
              `<li><button type="button" data-q="${pt.id}" data-i="${i}">
        <span class="mcq-k">${KEYS[i]}</span><span>${o}</span></button></li>`,
          )
          .join("");
        const wrong = pt.distractors
          ? `<div class="why-wrong"><span class="lbl">Why the other options are wrong</span><ul>` +
            Object.entries(pt.distractors)
              .map(([k, v]) => `<li>${k}: ${v}</li>`)
              .join("") +
            `</ul></div>`
          : "";
        return `<article class="part" id="${pt.id}" data-correct="${pt.correct}">
    <div class="qline"><span class="plabel">(${n})</span><span>${pt.question}</span></div>
    <ul class="mcq-opts">${opts}</ul>
    <div class="mcq-verdict" role="status" aria-live="polite" hidden>
      <span class="mcq-msg"></span>
      <button type="button" class="mcq-retry">Clear selection</button>
    </div>
    <details class="sol" hidden><summary>Solution</summary><div class="solin">
      ${writtenHTML(pt.written) || stepsHTML(pt.steps)}
      ${wrong}
      ${notesHTML(pt.notes)}
    </div></details>
    ${videoHTML(pt.video).replace('<details class="vid">', '<details class="vid" hidden>')}</article>`;
      }

      function wireMCQs(root) {
        root.querySelectorAll(".part[data-correct]").forEach((part) => {
          const opts = [...part.querySelectorAll(".mcq-opts button")];
          const correct = Number(part.dataset.correct);
          const verdict = part.querySelector(".mcq-verdict");
          const msg = part.querySelector(".mcq-msg");
          const sol = part.querySelector("details.sol");
          const vid = part.querySelector("details.vid");

          /* The solution stays out of sight until a choice is made, so the student
       cannot read the working before committing to an answer. The video is a
       solution too, so it is covered by the same rule. */
          const clear = () => {
            opts.forEach((b) => {
              b.disabled = false;
              b.classList.remove("right", "wrong");
            });
            verdict.hidden = true;
            verdict.className = "mcq-verdict";
            msg.textContent = "";
            sol.hidden = true;
            sol.open = false;
            if (vid) {
              vid.open = false;
              vid.hidden = true;
            }
          };

          opts.forEach((btn, picked) =>
            btn.addEventListener("click", () => {
              opts.forEach((b, i) => {
                b.disabled = true;
                b.classList.remove("right", "wrong");
                if (i === correct) b.classList.add("right");
                else if (i === picked) b.classList.add("wrong");
              });
              verdict.hidden = false;
              verdict.className =
                "mcq-verdict " + (picked === correct ? "ok" : "no");
              msg.textContent =
                picked === correct
                  ? "Correct."
                  : `Not correct. The right answer is (${KEYS[correct]}).`;
              sol.hidden = false;
              if (vid) vid.hidden = false;
            }),
          );

          part.querySelector(".mcq-retry").addEventListener("click", clear);
        });
      }

      function reviewPanel(d, pid) {
        const roman = ROMAN;
        let h = `<nav class="local-jump" aria-label="Inside the review exercise">
      <div class="seg">
        <a href="#${pid}-mcq">Multiple choice</a>
        <a href="#${pid}-written">Written</a>
      </div></nav>`;

        h += `<section class="flow-section" id="${pid}-mcq"><header class="flow-head"><h2>Multiple choice</h2>
        <p class="lede">${d.intro}</p></header>`;
        const mcqSet = d.questions.find((q) => q.type === "mcq-set");
        if (mcqSet) {
          /* Same heading shape as every other question block. Building it by hand
       here is what made Question 1 look different from Questions 2 and 3. */
          h += `<section class="qblock">
      <div class="grp"><span class="qn">Question ${mcqSet.number}</span></div>
      <p class="stem">${mcqSet.stem}</p>
      ${mcqSet.parts.map((pt, i) => mcqHTML(pt, roman(i))).join("")}</section>`;
        }
        h += `</section><section class="flow-section" id="${pid}-written"><header class="flow-head"><h2>Written questions</h2></header>`;
        d.questions
          .filter((q) => q.type !== "mcq-set")
          .forEach((q) => {
            h += blockHTML("Question " + q.number, q.stem, q.parts, false);
          });
        (d.stubs || []).forEach((st) => {
          h += `<section class="qblock">
      <div class="grp"><span class="qn">Question ${st.number}</span></div>
      <article class="part"><div class="qline"><span>${st.stem}</span></div>
        <div class="placeholder" style="margin-top:var(--space-3);padding:var(--space-4)">
          <p style="margin:0">Solution not written yet.</p></div></article></section>`;
        });
        return h + `</section>`;
      }

      /* ======================================================================
   UNIT TEST  : a fixed paper, laid out the way the board lays one out
   ====================================================================== */
      function paperHTML(paper, opts) {
        let h = `<div class="paper"><div class="paper-head">
      <p class="school">${paper.school}</p>
      <h3>${paper.title}</h3>
      <div class="paper-rail">
        <span>Time <b>${paper.time}</b></span>
        <span>Total marks <b>${paper.marks}</b></span>
        <span>${paper.coverage}</span>
        ${paper.code ? `<span>Paper <b>${paper.code}</b></span>` : ""}
      </div></div><div class="paper-body">`;

        paper.sections.forEach((sec) => {
          h += `<section class="sec"><div class="sec-head">
      <h4>${sec.title}</h4><span class="sec-marks">${sec.arith}</span>
      <p class="sec-note">${sec.note}</p></div>`;
          sec.items.forEach((it, i) => {
            h += `<div class="pq"><span class="pq-n">${sec.numbering === "roman" ? "(" + ROMAN(i) + ")" : "(" + ROMAN(i) + ")"}</span>
        <div class="pq-body">${it.q}`;
            if (it.options)
              h +=
                `<ul class="pq-opts">` +
                it.options
                  .map((o, j) => `<li><span>${KEYS[j]})</span>${o}</li>`)
                  .join("") +
                `</ul>`;
            if (it.marks)
              h += `<p class="sec-note" style="margin-top:var(--space-1)">${it.marks} marks</p>`;
            h += `</div></div>`;
          });
          h += `</section>`;
        });
        h += `</div></div>`;
        if (opts && opts.tools)
          h += `<div class="paper-tools">
      <button class="btn btn-ghost" type="button" onclick="window.print()">Print this paper</button>
    </div>`;
        return h;
      }

      function unitTestPanel(paper) {
        return `<section class="flow-section" id="unittest-paper">
    <header class="flow-head"><h2>Unit Test</h2>
    <p class="lede">One fixed paper for this unit, in the shape of a board paper but
       drawn only from Unit ${paper.unit}. Sit it under timed conditions, then mark it
       against the answer key.</p></header>
    ${paperHTML(paper, { tools: true })}
    <details class="extra" style="margin-top:var(--space-5)">
      <summary>Answer key</summary>
      <div class="extrain"><p>The key is written alongside the paper and will appear
      here once the full unit is authored. Do not open it before you have attempted
      the paper.</p></div></details>
  </section>`;
      }

      /* ======================================================================
   GENERATOR
   ====================================================================== */
      function generatorPanel(unit, bank) {

            )
            .join("") +
          `<label><input type="checkbox" class="gen-ex" value="review" checked><span>Review Exercise</span></label>`;

        return `<section class="flow-section" id="generator-form">
    <header class="flow-head"><h2>Practice paper generator</h2>
    <p class="lede">Build a fresh practice paper from this unit. Choose which exercises to
       draw from, how hard it should be, and how long it should be. Every paper is
       different, and every paper comes with a marking key.</p></header>
    ${
      ready
        ? ""
        : `<div class="warn"><b>Bank not ready.</b> The question bank for Unit ${unit}
       is still being written, so the controls below are live but no paper can be drawn yet.
       It needs ${bank ? bank.need : "100 multiple choice, 100 short and 50 long questions"}.</div>`
    }
    <div class="gen-form">
      <div class="field">
        <span class="lbl" id="lab-scope">Draw questions from</span>
        <p class="hint">Tick one exercise to revise just that, or several to mix them.</p>
        <div class="choice checks" role="group" aria-labelledby="lab-scope">${boxes}</div>
        <div class="paper-tools" style="margin-top:var(--space-3)">
          <button class="btn btn-ghost btn-sm" type="button" id="gen-all">Select all</button>
          <button class="btn btn-ghost btn-sm" type="button" id="gen-none">Clear all</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="lab-kind">Paper type</span>
        <p class="hint">The board pattern follows the Pairing Scheme on book page 242.
           It can only be built from the whole unit, so it turns on when every exercise
           above is ticked.</p>
        <div class="choice" role="radiogroup" aria-labelledby="lab-kind">
          <label><input type="radio" name="kind" value="practice" checked>
            <span>Practice paper &middot; you choose the length</span></label>
          <label id="lab-board"><input type="radio" name="kind" value="board">
            <span>Board pattern &middot; 35 marks &middot; 1 h 15 m</span></label>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="lab-diff">Difficulty</span>
        <p class="hint">Applies to whichever paper type you choose.</p>
        <div class="choice" role="radiogroup" aria-labelledby="lab-diff">
          <label><input type="radio" name="diff" value="easy"><span>Gentle</span></label>
          <label><input type="radio" name="diff" value="mixed" checked><span>Mixed</span></label>
          <label><input type="radio" name="diff" value="hard"><span>Challenging</span></label>
        </div>
      </div>
      <div class="field" id="lengths">
        <span class="lbl">How many questions</span>
        <p class="hint">Ignored when the board pattern is selected, because that pattern
           fixes its own counts.</p>
        <div class="mix">
          <label><span>Multiple choice</span><input type="number" id="n-mcq" value="9" min="1" max="30"></label>
          <label><span>Short questions</span><input type="number" id="n-short" value="9" min="1" max="30"></label>
          <label><span>Long questions</span><input type="number" id="n-long" value="3" min="1" max="10"></label>
        </div>
      </div>
      <div class="paper-tools">
        <button class="btn btn-primary" type="button" id="gen-go">Generate paper</button>
        <button class="btn btn-ghost" type="button" id="gen-key" disabled>Show marking key</button>
      </div>
      <p class="gen-status" id="gen-status" role="status" aria-live="polite"></p>
    </div>
    <div id="gen-out"></div>
  </section>`;
      }

      function wireGenerator(unit, bank) {
        const go = document.getElementById("gen-go");
        if (!go) return;
        const st = document.getElementById("gen-status");
        const out = document.getElementById("gen-out");
        const boxes = [...document.querySelectorAll(".gen-ex")];
        const board = document.querySelector(
          'input[name="kind"][value="board"]',
        );
        const boardL = document.getElementById("lab-board");
        const lengths = document.getElementById("lengths");

        /* The board pattern needs the whole unit, so it is only offered when every
     exercise is ticked. Turning a control off silently would be worse than
     saying why, so the label carries the reason. */
        const sync = () => {
          const all = boxes.every((b) => b.checked);
          board.disabled = !all;
          boardL.classList.toggle("is-off", !all);
          boardL.title = all
            ? ""
            : "Tick every exercise to use the board pattern";
          if (!all && board.checked)
            document.querySelector(
              'input[name="kind"][value="practice"]',
            ).checked = true;
          lengths.hidden = board.checked;
        };
        boxes.forEach((b) => b.addEventListener("change", sync));
        document
          .querySelectorAll('input[name="kind"]')
          .forEach((r) => r.addEventListener("change", sync));
        document.getElementById("gen-all").addEventListener("click", () => {
          boxes.forEach((b) => (b.checked = true));
          sync();
        });
        document.getElementById("gen-none").addEventListener("click", () => {
          boxes.forEach((b) => (b.checked = false));
          sync();
        });
        sync();

        go.addEventListener("click", () => {
          const picked = boxes.filter((b) => b.checked).map((b) => b.value);
          if (!picked.length) {
            st.textContent = "Pick at least one exercise to draw from.";
            out.innerHTML = "";
            return;
          }
          if (!bank || !bank.ready) {
            const names = picked
              .map((v) =>
                v === "review" ? "the review exercise" : "Exercise " + v,
              )
              .join(", ");
            st.textContent =
              `No paper drawn. You asked for ${names}, but the Unit ${unit} ` +
              `question bank is not written yet, so there is nothing to draw from. A generator ` +
              `that quietly returned a short paper would be worse than one that says it cannot.`;
            out.innerHTML = "";
            return;
          }
          st.textContent = "";
        });
      }

      /* ======================================================================
   UNIT VIEW : assembly
   ====================================================================== */
      function buildUnit(n) {
        const u = BOOK.units.find((x) => x.n === n);
        if (!u) return false;
        CURRENT_UNIT = n;

        document.title = `Unit ${n} · ${u.title} : Class 10 Mathematics`;
        document.getElementById("crumb-unit").textContent =
          `Unit ${n} · ${u.title}`;
        document.getElementById("unit-title").innerHTML =
          `<span class="u-n">Unit ${n}</span> &middot; ${u.title}`;
        const first = u.exercises[0],
          last = u.exercises[u.exercises.length - 1];
        document.getElementById("q-help").textContent =
          `Searches Concepts, Exercise ${first} to ${last} and their solutions. ` +
          `The Unit Test and generated papers are not searched.`;
        document.getElementById("q").value = "";
        document.getElementById("q-count").textContent = "";
        document.getElementById("q-clear").hidden = true;

        buildIndex(n);
        TABS = u.exercises
          .map((e) => ({
            id: "ex" + e.replace(".", ""),
            label: "Exercise " + e,
            ex: e,
          }))
          .concat([
            { id: "review", label: "Review Exercise" },
            { id: "unittest", label: "Unit Test" },
            { id: "generator", label: "Generator" },
          ]);

        const tl = document.getElementById("tablist");
        tl.innerHTML = "";
        const ps = document.getElementById("panels");
        ps.innerHTML = "";

        TABS.forEach((t, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.id = `tab-${t.id}`;
          btn.setAttribute("aria-controls", `panel-${t.id}`);
          btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
          btn.tabIndex = i === 0 ? 0 : -1;
          btn.textContent = t.label;
          tl.appendChild(btn);

          const panel = document.createElement("div");
          panel.setAttribute("role", "tabpanel");
          panel.id = `panel-${t.id}`;
          panel.setAttribute("aria-labelledby", `tab-${t.id}`);
          panel.tabIndex = 0;
          if (i !== 0) panel.hidden = true;
          const per = CONTENT[n] || {};
          let html;
          if (t.ex && per[t.ex]) html = exercisePanel(per[t.ex], t.id);
          else if (t.id === "review" && per["Review " + n])
            html = reviewPanel(per["Review " + n], t.id);
          else if (t.id === "unittest" && PAPERS[n])
            html = unitTestPanel(PAPERS[n]);
          else if (t.id === "generator") html = generatorPanel(n, BANKS[n]);
          else
            html = `<div class="placeholder"><h3>${t.label}</h3>
         <p>Not written yet. This panel is wired and will fill in as the content is authored.</p></div>`;
          panel.innerHTML = html;
          wireMCQs(panel);
          wireVideos(panel);
          ps.appendChild(panel);
        });
        return true;
      }

      /* ======================================================================
   Sticky measurement, stuck shadows, fade, scrollspy, search
   ====================================================================== */
      function measureSticky() {
        const tabs = document.getElementById("tabsWrap");
        document.documentElement.style.setProperty(
          "--sticky-tabs",
          (tabs.offsetParent === null
            ? 0
            : Math.ceil(tabs.getBoundingClientRect().height)) + "px",
        );
        const jump = document.querySelector(
          '[role="tabpanel"]:not([hidden]) .local-jump',
        );
        /* Round up. A fractional height leaves a hairline gap and content shows
     through between the two sticky bars. */
        document.documentElement.style.setProperty(
          "--sticky-jump",
          jump ? Math.ceil(jump.getBoundingClientRect().height) + "px" : "0px",
        );
      }

      let observers = [];
      function watchStuck() {
        observers.forEach((o) => o.disconnect());
        observers = [];
        const cs = getComputedStyle(document.documentElement);
        const tabsH = parseInt(cs.getPropertyValue("--sticky-tabs")) || 0;
        const jumpH = parseInt(cs.getPropertyValue("--sticky-jump")) || 0;
        document.querySelectorAll(".local-jump, .grp").forEach((el) => {
          const offset = tabsH + (el.classList.contains("grp") ? jumpH : 0);
          const io = new IntersectionObserver(
            ([e]) => {
              /* intersectionRatio < 1 alone also fires for anything still below the
         fold, so require the element to have passed the sticky line too. */
              const passed =
                e.rootBounds && e.boundingClientRect.top <= e.rootBounds.top;
              el.classList.toggle(
                "is-stuck",
                e.intersectionRatio < 1 && !!passed,
              );
            },
            { rootMargin: `-${offset + 1}px 0px 0px 0px`, threshold: [1] },
          );
          io.observe(el);
          observers.push(io);
        });
      }

      function wireTabFade() {
        const shell = document.getElementById("tabsShell");
        const strip = document.getElementById("tablist");
        const update = () => {
          const max = strip.scrollWidth - strip.clientWidth;
          shell.classList.toggle("more-left", strip.scrollLeft > 2);
          shell.classList.toggle("more-right", strip.scrollLeft < max - 2);
        };
        strip.addEventListener("scroll", update, { passive: true });
        addEventListener("resize", update, { passive: true });
        update();
        return update;
      }

      let spyHandler = null;
      function wireScrollSpy() {
        if (spyHandler) removeEventListener("scroll", spyHandler);
        const panel = document.querySelector('[role="tabpanel"]:not([hidden])');
        if (!panel) return;
        const links = [...panel.querySelectorAll(".local-jump a")];
        const sections = links
          .map((a) => panel.querySelector(a.getAttribute("href")))
          .filter(Boolean);
        if (!sections.length) return;
        spyHandler = () => {
          const cs = getComputedStyle(document.documentElement);
          /* The line must match where an anchored section actually lands, which is
       the sticky height plus its own scroll-margin-top. */
          const margin =
            parseInt(getComputedStyle(sections[0]).scrollMarginTop) || 0;
          const line = Math.max(
            (parseInt(cs.getPropertyValue("--sticky-tabs")) || 0) +
              (parseInt(cs.getPropertyValue("--sticky-jump")) || 0) +
              8,
            margin + 4,
          );
          let current = sections[0];
          for (const s of sections)
            if (s.getBoundingClientRect().top <= line) current = s;
          if (
            window.innerHeight + window.scrollY >=
            document.body.scrollHeight - 4
          )
            current = sections[sections.length - 1];
          links.forEach((a) =>
            a.setAttribute(
              "aria-current",
              a.getAttribute("href") === "#" + current.id ? "true" : "false",
            ),
          );
        };
        addEventListener("scroll", spyHandler, { passive: true });
        spyHandler();
      }

      /* ======================================================================
   SEARCH
   Builds an index once per unit from the authored content, so it finds items
   in exercises that are not the panel currently open. Scope is every exercise
   plus the review exercise. The unit test and generated papers are excluded
   on purpose: those are assessment, and searching them would leak answers.
   ====================================================================== */
      let INDEX = [];

      function plain(html) {
        const d = document.createElement("div");
        d.innerHTML = String(html || "").replace(/\$\$?/g, " ");
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function buildIndex(unit) {
        INDEX = [];
        const perUnit = CONTENT[unit] || {};
        for (const [ex, d] of Object.entries(perUnit)) {
          const tabId =
            d.kind === "review" ? "review" : "ex" + ex.replace(".", "");
          const where =
            d.kind === "review" ? "Review Exercise" : "Exercise " + ex;

          (d.definitions || []).forEach((def) =>
            INDEX.push({
              tab: tabId,
              where: `${where} · Concepts`,
              id: null,
              text: `${def.term} ${plain(def.statement)} ${(def.notes || []).map(plain).join(" ")} ${(def.examples || []).map(plain).join(" ")}`,
              show: def.term,
            }),
          );

          (d.whyItWorks || []).forEach((u) =>
            INDEX.push({
              tab: tabId,
              where: `${where} · Concepts`,
              id: null,
              text: `${u.title} ${u.body.map(plain).join(" ")}`,
              show: u.title,
            }),
          );

          ["examples", "questions"].forEach((g) =>
            (d[g] || []).forEach((q) => {
              const label = g === "examples" ? q.label : "Question " + q.number;
              (q.parts || []).forEach((pt) => {
                const body =
                  `${plain(q.stem)} ${plain(pt.question)} ${plain(pt.answer)} ` +
                  (pt.steps || [])
                    .map((st) => plain(st.why) + " " + st.math)
                    .join(" ") +
                  " " +
                  (pt.options || []).map(plain).join(" ");
                INDEX.push({
                  tab: tabId,
                  where: `${where} · ${label}`,
                  id: pt.id || null,
                  text: body,
                  show: `${label} ${pt.label || ""} ${plain(pt.question) || plain(q.stem)}`.trim(),
                });
              });
            }),
          );
        }
      }

      function runSearch() {
        const input = document.getElementById("q");
        const clear = document.getElementById("q-clear");
        const count = document.getElementById("q-count");
        const box = document.getElementById("results");
        const panels = document.getElementById("panels");
        const term = input.value.trim().toLowerCase();

        clear.hidden = !term;
        if (term.length < 2) {
          box.hidden = true;
          box.innerHTML = "";
          panels.hidden = false;
          document.getElementById("tabsWrap").hidden = false;
          count.textContent = "";
          return;
        }
        const hits = INDEX.filter((r) =>
          r.text.toLowerCase().includes(term),
        ).slice(0, 60);
        count.textContent =
          hits.length === 0
            ? "Nothing found in this unit."
            : hits.length === 1
              ? "1 result"
              : `${hits.length} results`;
        panels.hidden = true;
        document.getElementById("tabsWrap").hidden =
          true; /* results are not inside a tab */
        box.hidden = false;
        box.innerHTML = hits.length
          ? `<div class="res-head"><h2>Results for &ldquo;${plain(input.value)}&rdquo;</h2>
         <button class="res-clear" type="button" id="res-back">Back to the unit</button></div>
       <ul class="res-list">` +
            hits
              .map(
                (r, i) =>
                  `<li class="res-item"><a href="#" data-i="${i}">
           <span class="res-where">${r.where}</span>
           <span class="res-text">${r.show}</span></a></li>`,
              )
              .join("") +
            `</ul>`
          : `<div class="res-head"><h2>No results</h2>
         <button class="res-clear" type="button" id="res-back">Back to the unit</button></div>
       <div class="res-none">Nothing in this unit matches that. Try a shorter word,
       or a symbol such as <code>sqrt</code> or <code>conjugate</code>.</div>`;

        typeset(box);
        const back = document.getElementById("res-back");
        if (back)
          back.addEventListener("click", () => {
            input.value = "";
            runSearch();
            input.focus();
          });
        box.querySelectorAll(".res-item a").forEach((a) =>
          a.addEventListener("click", (e) => {
            e.preventDefault();
            const r = hits[Number(a.dataset.i)];
            input.value = "";
            runSearch();
            selectTab(r.tab);
            if (r.id)
              requestAnimationFrame(() => {
                const el =
                  document.getElementById(r.id) ||
                  document.querySelector(`[data-part="${r.id}"]`);
                if (el) {
                  el.scrollIntoView({ block: "center" });
                  el.classList.add("flash");
                  setTimeout(() => el.classList.remove("flash"), 1700);
                }
              });
          }),
        );
      }

      function wireSearch() {
        const input = document.getElementById("q");
        const clear = document.getElementById("q-clear");
        let t;
        input.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(runSearch, 140);
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            input.value = "";
            runSearch();
          }
        });
        clear.addEventListener("click", () => {
          input.value = "";
          runSearch();
          input.focus();
        });
      }

      function markWideCompacts() {
        document.querySelectorAll(".written").forEach((c) => {
          const body = c.querySelector(".written-body");
          c.classList.toggle(
            "is-wide",
            body.scrollWidth > body.clientWidth + 2,
          );
        });
      }

      /* ======================================================================
   Tabs
   ====================================================================== */
      /* Where the reader lands after switching exercise.

   If the unit heading was still on screen when they clicked, they were at the
   top of the unit, not deep inside an exercise. Leave the page where it is:
   jumping them down to Concepts would be an unasked-for move.

   If they were reading deep inside an exercise, put the new exercise's first
   section directly under the sticky bars, so the nav stays put and they land at
   Concepts rather than back beside the unit heading. */
      function landOnPanel(panel, wasAtTop) {
        if (wasAtTop || !panel) return;
        markWideCompacts();
        const cs = getComputedStyle(document.documentElement);
        const stuck =
          (parseFloat(cs.getPropertyValue("--sticky-tabs")) || 0) +
          (parseFloat(cs.getPropertyValue("--sticky-jump")) || 0);
        const first = panel.querySelector(".flow-section") || panel;
        const y =
          window.scrollY + first.getBoundingClientRect().top - stuck - 8;
        window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
      }

      function selectTab(id, { focus = false, keepScroll = false } = {}) {
        /* Read the position BEFORE the swap. Hiding one panel and showing another
     changes the document height, and the browser clamps the scroll position, so
     afterwards everybody looks as though they were at the top. */
        const mast = document.querySelector(".masthead");
        const wasAtTop = !mast || mast.getBoundingClientRect().bottom > 0;

        TABS.forEach((t) => {
          const btn = document.getElementById(`tab-${t.id}`);
          const panel = document.getElementById(`panel-${t.id}`);
          const on = t.id === id;
          btn.setAttribute("aria-selected", on ? "true" : "false");
          btn.tabIndex = on ? 0 : -1;
          panel.hidden = !on;
        });
        const btn = document.getElementById(`tab-${id}`);
        if (focus) btn.focus();
        /* Bring the tab into view by scrolling the STRIP sideways only.
     scrollIntoView also moves the page vertically, which undoes the landing
     below and drops the reader back beside the unit heading. */
        const strip = document.getElementById("tablist");
        const br = btn.getBoundingClientRect(),
          sr = strip.getBoundingClientRect();
        if (br.left < sr.left) strip.scrollLeft += br.left - sr.left - 12;
        if (br.right > sr.right) strip.scrollLeft += br.right - sr.right + 12;

        if (history.replaceState)
          history.replaceState(null, "", `#/unit-${CURRENT_UNIT}/${id}`);
        refreshUnitChrome();
        landOnPanel(
          document.getElementById(`panel-${id}`),
          keepScroll ? true : wasAtTop,
        );
      }

      function wireTabs() {
        const tl = document.getElementById("tablist");
        tl.addEventListener("click", (e) => {
          const b = e.target.closest('[role="tab"]');
          if (b) selectTab(b.id.replace(/^tab-/, ""));
        });
        tl.addEventListener("keydown", (e) => {
          if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key))
            return;
          e.preventDefault();
          const idx = TABS.findIndex(
            (t) =>
              document
                .getElementById(`tab-${t.id}`)
                .getAttribute("aria-selected") === "true",
          );
          let n = idx;
          if (e.key === "ArrowRight") n = (idx + 1) % TABS.length;
          if (e.key === "ArrowLeft") n = (idx - 1 + TABS.length) % TABS.length;
          if (e.key === "Home") n = 0;
          if (e.key === "End") n = TABS.length - 1;
          selectTab(TABS[n].id, { focus: true });
        });
      }

      function wireToTop() {
        const b = document.getElementById("toTop");
        const place = () => {
          const main =
            document.querySelector("#main") || document.querySelector(".wrap");
          if (!main) return;
          const half = main.getBoundingClientRect().width / 2;
          document.documentElement.style.setProperty(
            "--content-half",
            half + "px",
          );
          /* Room for the button plus a margin, or it goes back to the corner. */
          b.classList.toggle(
            "corner",
            innerWidth / 2 + half + 16 + 48 + 8 > innerWidth,
          );
        };
        addEventListener("resize", place, { passive: true });
        place();
        const on = () => {
          place();
          b.classList.toggle("on", window.scrollY > 600);
        };
        addEventListener("scroll", on, { passive: true });
        on();
        b.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
          const t = document.querySelector(
            '[role="tab"][aria-selected="true"]',
          );
          (t || document.body).focus();
        });
      }

      function typeset(root) {
        if (!window.renderMathInElement) return;
        renderMathInElement(root, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
          strict: false,
        });
      }

      function refreshUnitChrome() {
        measureSticky();
        watchStuck();
        markWideCompacts();
        updateFade();
        wireScrollSpy();
      }

      /* ======================================================================
   Routing.  #/ is the book, #/unit-N is a unit, #/unit-N/tab opens a tab.
   ====================================================================== */
      function showView(which) {
        document.getElementById("view-book").hidden = which !== "book";
        document.getElementById("view-unit").hidden = which !== "unit";
      }

      function route() {
        const hash = location.hash;
        /* In-page anchors such as #ex11-examples and #main are not routes. Without
     this guard, clicking a section link would look like an unknown route and
     bounce the reader back to the contents page. */
        if (hash && !hash.startsWith("#/")) return;

        const raw = hash.replace(/^#\/?/, "");
        const m = raw.match(/^unit-(\d+)(?:\/([\w.]+))?$/);

        if (!m) {
          showView("book");
          document.title = "Class 10 Mathematics : PECTAA solutions";
          window.scrollTo({ top: 0, behavior: "auto" });
          return;
        }
        const n = Number(m[1]);
        if (!buildUnit(n)) {
          location.hash = "#/";
          return;
        }
        showView("unit");
        typeset(document.getElementById("view-unit"));
        wireTabs();
        updateFade = wireTabFade();
        window.scrollTo({ top: 0, behavior: "auto" });
        const wanted =
          m[2] && TABS.some((t) => t.id === m[2]) ? m[2] : TABS[0].id;
        selectTab(wanted, { keepScroll: true });
        wireGenerator(n, BANKS[n]);
      }

      function start() {
        renderBook();
        typeset(document.getElementById("view-book"));
        wireSearch();
        wireToTop();
        addEventListener("resize", measureSticky, { passive: true });
        addEventListener("hashchange", route);
        route();
      }

      addEventListener("DOMContentLoaded", () => {
        window.renderMathInElement ? start() : setTimeout(start, 350);
      });
    </script>
  </body>
</html>
